[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-forge"
version = "0.1.0"
description = "Turn raw multi-camera podcast footage into a graded, mastered episode, trailer, reels and thumbnails from one YAML file."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Datta Eswar Tangeti" }]
keywords = ["podcast", "video-editing", "ffmpeg", "multicam", "auto-edit", "shorts", "reels"]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "librosa>=0.10",
  "scikit-learn>=1.3",
  "opencv-python>=4.8",
  "pillow>=10.1",
  "pyyaml>=6",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.0"]
thumbs = ["rembg>=2.0", "onnxruntime>=1.16"]
dev = ["pytest>=8"]

[project.scripts]
pf = "podcastforge.cli:main"

[tool.setuptools.packages.find]
include = ["podcastforge*"]

[tool.setuptools.package-data]
podcastforge = ["project.example.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
